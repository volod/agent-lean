name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The steps of `lake exe repo ci`, with elan and the .lake cache.
      - uses: leanprover/lean-action@v1
        with:
          build-args: --wfail
          test: true
          test-args: --wfail
          lint: true
      - name: Release archive
        run: lake exe repo dist
